services:
  ollama:
    image: ollama/ollama:0.21.0
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    healthcheck:
      test: "ollama list || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  ollama-puller:
    image: ollama/ollama:0.21.0
    container_name: ollama_puller
    command: pull llama3.2
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  agent:
    build: .
    container_name: agent
    stdin_open: true
    tty: true
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DATABASE_URL=postgresql://agent:agent@postgres:5432/agent_db
    volumes:
      - ./data:/app/data
    depends_on:
      ollama-puller:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    volumes:
      - ./data/seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U agent -d agent_db" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
