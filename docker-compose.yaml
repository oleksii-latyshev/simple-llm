services:
  ollama:
    image: ollama/ollama:0.21.0
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    healthcheck:
      test: "ollama list || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  ollama-puller:
    image: ollama/ollama:0.21.0
    container_name: ollama_puller
    command: pull llama3.2
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  agent:
    build: .
    container_name: agent
    stdin_open: true
    tty: true
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./test_document.txt:/app/test_document.txt
    depends_on:
      ollama-puller:
        condition: service_completed_successfully
